[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyofdr"
version = "0.1.0"
description = "OFDR simulator for distributed fiber sensing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Alessandro Meoli", email = "alessandromeoli@gmail.com"},
]
keywords = ["ofdr", "fiber sensing", "rayleigh", "interferometry", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pint>=0.22",
]

[project.urls]
Homepage = "https://github.com/ameoli/PyOFDR"
Issues = "https://github.com/ameoli/PyOFDR/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
