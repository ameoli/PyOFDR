[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyofdr"
version = "0.9.0a0"
description = "OFDR simulator for distributed fiber sensing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/colorednoise-MIT.txt"]
requires-python = ">=3.10"
authors = [
    {name = "A. Meoli", email = "alessandro.meoli@unicampania.it"},
]
keywords = ["ofdr", "fiber sensing", "rayleigh", "interferometry", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pint>=0.22",
    "h5py>=3.8",
]

[project.urls]
Homepage = "https://github.com/ameoli/PyOFDR"
Issues = "https://github.com/ameoli/PyOFDR/issues"

[project.scripts]
pyofdr = "pyofdr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
tutorials = ["matplotlib", "jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
