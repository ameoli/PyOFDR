simulation:
  seed: 123
  backend: numpy

fiber:
  length: "10 m"
  n_core: 1.4682
  rayleigh_coefficient_dB: -82
  attenuation_dB_per_km: 0.18   # SMF-28 at 1550nm

source:
  center_wavelength: "1550 nm"
  sweep_range: "40 nm"
  sweep_duration: "10 ms"
  power: "10 mW"
  linewidth: "100 kHz"

optics:
  splitting_ratio: 0.5
  circulator:
    insertion_loss_dB: 0.7
    isolation_dB: 50
    return_loss_dB: 55

detection:
  responsivity: 1.0             # A/W
  bandwidth: "100 MHz"
  filter_order: 4
  shot_noise: true
  thermal_nep: 1.0e-11          # W/sqrt(Hz)
  dark_current: "1 nA"

adc:
  bits: 16
  sample_rate: "200 MHz"
  voltage_range: "2 V"
  input_impedance: "50 ohm"
