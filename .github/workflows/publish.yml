name: Package and publish

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the sdist and build the wheel from it
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel and run a sweep outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          source "$RUNNER_TEMP/smoke/bin/activate"
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          import os
          import pyofdr
          assert pyofdr.__version__ == version("pyofdr")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == "v" + version("pyofdr"), "tag and package version differ"
          PY
          config="$GITHUB_WORKSPACE/configs/ofdr_basic.yaml"
          pyofdr validate "$config"
          pyofdr run "$config" -o smoke.h5
          python - <<'PY'
          import h5py
          with h5py.File("smoke.h5") as f:
              assert f["sweeps/0000/digital_main"].shape == (1, 2000000)
          PY
      - uses: actions/upload-artifact@v5
        if: github.ref_type == 'tag'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyofdr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  check-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install this release from PyPI
        run: |
          cd "$RUNNER_TEMP"
          version="${GITHUB_REF_NAME#v}"
          python -m venv from-pypi
          source from-pypi/bin/activate
          for attempt in 1 2 3 4 5; do
            if python -m pip --isolated install --index-url https://pypi.org/simple --only-binary pyofdr --no-cache-dir "pyofdr==$version"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 15
          done
          python -c 'import pyofdr, sys; assert pyofdr.__version__ == sys.argv[1]' "$version"
          pyofdr validate "$GITHUB_WORKSPACE/configs/ofdr_basic.yaml"
